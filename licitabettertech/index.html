<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Licita Better Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --graf:#191D1B; --graf2:#2A2F2C; --verde:#A4DF00; --verde-esc:#628600; --verde-bg:#EEF8D6; --verde-bd:#D6EC9C;
  --mineral:#F4F5F0; --nevoa:#DCE2D8; --card:#FFFFFF; --txt:#191D1B; --txt2:#5C625E; --linha:#E3E7DF;
  --ok:#1E7A3A; --ok-bg:#E3F4E8; --warn:#8A5A00; --warn-bg:#FFF3D1; --lar:#A04A00; --lar-bg:#FFE6D1; --err:#B42318; --err-bg:#FDE4E1;
  --azul:#2E6FB0; --azul-bg:#E4EEF8; --r:12px; --sombra:0 1px 2px rgba(25,29,27,.06),0 4px 16px rgba(25,29,27,.05);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--mineral);color:var(--txt);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit;font-size:13px}
a{color:var(--azul)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--graf);color:#E9ECE6;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--verde);display:grid;place-items:center;color:var(--graf);font-weight:700;font-size:17px}
.logo b{font-size:15px;display:block} .logo small{font-size:11px;color:#9BA39D}
.emp{background:var(--graf2);border-radius:10px;padding:10px 12px}
.emp label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#9BA39D}
.emp select{width:100%;margin-top:4px;background:transparent;color:#fff;border:1px solid #3A403C;border-radius:7px;padding:6px 8px}
.emp select option{color:var(--graf)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#C9CFC8;font-size:13.5px}
.nav button:hover{background:#252A27;color:#fff}
.nav button.on{background:var(--verde);color:var(--graf);font-weight:600}
.nav .ct{margin-left:auto;font-size:11px;background:#303632;color:#E9ECE6;border-radius:20px;padding:1px 8px}
.nav button.on .ct{background:rgba(25,29,27,.15);color:var(--graf)}
.ic{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:11px;color:#8A928C;border-top:1px solid #303632;padding-top:12px}
.side .foot a{color:var(--verde)}
/* main */
.main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;font-weight:600}
.top .sub{color:var(--txt2);font-size:13px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
.btn{border:1px solid var(--linha);background:#fff;color:var(--txt);border-radius:8px;padding:7px 13px;font-weight:500;font-size:13px}
.btn:hover{border-color:#C3CABF}
.btn.pri{background:var(--verde);border-color:var(--verde);color:var(--graf);font-weight:600}
.btn.pri:hover{filter:brightness(.96)}
.btn.dk{background:var(--graf);border-color:var(--graf);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)} .k2{grid-template-columns:1fr 1fr}
.kpi .l{font-size:12px;color:var(--txt2)} .kpi .n{font-size:26px;font-weight:600;margin-top:2px;letter-spacing:-.01em} .kpi .d{font-size:12px;color:var(--txt2);margin-top:2px}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--txt2)} .small{font-size:12px}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-align:left;color:var(--txt2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EEF1EB;vertical-align:top;font-size:13px}
tr.cl:hover td{background:#FAFBF7;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* status */
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-warn{background:var(--warn-bg);color:var(--warn)} .st-lar{background:var(--lar-bg);color:var(--lar)} .st-err{background:var(--err-bg);color:var(--err)} .st-az{background:var(--azul-bg);color:var(--azul)} .st-v{background:var(--verde-bg);color:var(--verde-esc);border:1px solid var(--verde-bd)} .st-n{background:#EEF1EB;color:var(--txt2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* chips categoria */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:#fff;border-radius:10px;padding:8px 12px;text-align:left;min-width:150px;transition:.12s}
.chip:hover{border-color:var(--verde-esc)}
.chip b{display:block;font-size:13px;font-weight:600}
.chip span{font-size:11.5px;color:var(--txt2)}
.chip.on{background:var(--graf);border-color:var(--graf);color:#fff}
.chip.on span{color:#B8C0BA}
.chip.on b::after{content:" ✓";color:var(--verde)}
.subchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sc{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px}
.sc.on{background:var(--verde);border-color:var(--verde);font-weight:600}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.filtros select,.filtros input{border:1px solid var(--linha);border-radius:8px;padding:6px 9px;background:#fff}
.filtros input{min-width:220px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(25,29,27,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--mineral);z-index:50;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:none} .ov.on{display:block}
.dh{background:#fff;border-bottom:1px solid var(--linha);padding:16px 22px}
.dh .x{float:right;border:0;background:none;font-size:22px;color:var(--txt2)}
.tabs{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--txt2);font-weight:500;font-size:13px}
.tab.on{background:var(--graf);color:#fff}
.db{padding:18px 22px;overflow:auto;flex:1}
.req{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF1EB}
.req .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:#E9ECE5;border-radius:12px;padding:10px;min-height:420px}
.col h4{margin:2px 4px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.col h4 .ct{margin-left:auto;font-weight:500;color:var(--txt2)}
.col.drag{outline:2px dashed var(--verde-esc)}
.kc{overflow-wrap:anywhere;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:12.5px}
.kc .t{font-weight:600;font-size:12.5px;margin-bottom:3px}
.bar{height:5px;background:#EEF1EB;border-radius:5px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--verde-esc)}
/* proposta */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{font-size:12px;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--linha);color:var(--txt2)}
.step.done{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde-esc)}
.step.cur{background:var(--graf);color:#fff;border-color:var(--graf)}
.in{border:1px solid var(--linha);border-radius:7px;padding:5px 8px;width:100%;background:#fff}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--linha);font-size:13px}
.tot.big{font-size:18px;font-weight:600;border:0;padding-top:10px}
.alert{border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
textarea.in{min-height:150px;line-height:1.5}
/* cofre */
.vbar{height:6px;border-radius:6px;background:#EEF1EB;position:relative;overflow:hidden;min-width:90px}
.vbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.hbar .lb{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:14px;background:#EEF1EB;border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--verde-esc);border-radius:4px}
.hbar .vl{width:90px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--graf);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.banner{background:var(--graf);color:#E9ECE6;border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:12.5px}
.banner b{color:var(--verde)}
@media (max-width:980px){
  .app{grid-template-columns:1fr} .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .nav{flex-direction:row;flex-wrap:wrap} .side .foot,.emp{display:none}
  .k4,.k3,.k2{grid-template-columns:1fr 1fr} .main{padding:16px}
}
@media (max-width:560px){ .k4,.k3,.k2{grid-template-columns:1fr} .filtros input{min-width:0;width:100%} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mk">B</div><div><b>Licita Better Tech</b><small>motor Licita 360 · i10</small></div></div>
    <div class="emp"><label>Empresa</label>
      <select id="empSel" onchange="trocaEmpresa(this.value)">
        <option value="better">Better Tech Ltda</option>
        <option value="nova">+ Cadastrar outra empresa</option>
      </select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Mockup navegável com dados reais do PNCP de 26/09/2026.<br>Sistema em produção: <a href="/licita360/portal/login">entrar no portal</a></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="ov" id="ov" onclick="fechaDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script src="/licitabettertech/dados.js"></script>
<script>
const P = window.PREGOES || [];
const HOJE = new Date('2026-09-26T12:00');
const $ = s => document.querySelector(s);
const brl = v => v==null ? 'sigiloso' : 'R$ ' + (v>=1e6 ? (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi' : v>=1e3 ? (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil' : v.toLocaleString('pt-BR',{maximumFractionDigits:2}));
const brlF = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt = s => s ? new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+s.slice(11,16) : '—';
const dias = s => Math.ceil((new Date(s)-HOJE)/864e5);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem('lbt_'+k)); localStorage.setItem('lbt_'+k,JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }

const ST = {
  'Pode participar':['st-ok','Pode participar'],
  'Pode participar com ressalvas':['st-warn','Com ressalvas'],
  'Depende do balanço':['st-lar','Depende do balanço'],
  'Impedida':['st-err','Impedida']
};
const stPill = s => { const [c,l]=ST[s]||['st-n',s]; return `<span class="pill ${c}">${l}</span>`; };
const prPill = p => p==='A'?'<span class="pill st-v">A</span>':p==='B'?'<span class="pill st-az">B</span>':p==='C'?'<span class="pill st-n">C</span>':'<span class="pill st-n">—</span>';
const CAT_ORD = ["ERP e gestão pública","Educação e plataformas de ensino","RH, folha e ponto","CRM, atendimento e cidadão","Saúde","Desenvolvimento e sustentação","Infraestrutura, nuvem e dados","Segurança da informação","Licenças de software de terceiros","Gestão documental","Portal, transparência e comunicação","Geoprocessamento e engenharia","Jurídico e procuradoria","Assistência social","Segurança pública, trânsito e fiscalização","Outros sistemas específicos","Correlato"];

const ETAPAS = [
  {k:'triagem',l:'Triagem',c:'#8A928C'},{k:'gonogo',l:'Go / No-go',c:'#2E6FB0'},{k:'docs',l:'Documentação',c:'#6B4FA0'},
  {k:'proposta',l:'Proposta',c:'#8A5A00'},{k:'disputa',l:'Disputa (lances)',c:'#628600'},{k:'habil',l:'Habilitação / recurso',c:'#A04A00'},{k:'resultado',l:'Resultado',c:'#1E7A3A'}
];
// funil inicial: pega oportunidades A reais
let FUNIL = store('funil') || (()=>{ const f={}; const a=P.filter(p=>p.p==='A' && p.st!=='Impedida').slice(0,14);
  const seq=['triagem','triagem','gonogo','gonogo','docs','docs','proposta','proposta','disputa','triagem','gonogo','docs','habil','resultado'];
  a.forEach((p,i)=>f[p.id]=seq[i]||'triagem'); return f; })();
const salvaFunil = ()=>store('funil',FUNIL);

const COFRE = [
  {n:'Contrato social consolidado (3ª alteração, JUCESP 28/07/2025)',cat:'Jurídica',val:null,st:'ok'},
  {n:'Cartão CNPJ',cat:'Jurídica',val:null,st:'ok'},
  {n:'Documento da administradora',cat:'Jurídica',val:'2032-02-27',st:'ok'},
  {n:'Procuração da sócia Better Education LLC',cat:'Jurídica',val:null,st:'pend'},
  {n:'CND Federal (RFB/PGFN)',cat:'Fiscal',val:'2027-01-26',st:'ok',auto:true},
  {n:'CNDT (débitos trabalhistas)',cat:'Fiscal',val:'2027-01-26',st:'ok',auto:true},
  {n:'CRF / FGTS',cat:'Fiscal',val:'2026-09-19',st:'venc',auto:true},
  {n:'Certidão municipal Barueri (ISS)',cat:'Fiscal',val:'2026-10-02',st:'ok',auto:true},
  {n:'Certidão estadual: débitos não inscritos',cat:'Fiscal',val:'2027-01-30',st:'ok',auto:true},
  {n:'Certidão estadual: débitos inscritos em dívida ativa (PGE-SP)',cat:'Fiscal',val:null,st:'pend',auto:true},
  {n:'Certidão de falência (TJSP/SAJ)',cat:'Econômica',val:'2026-10-29',st:'ok',auto:true},
  {n:'Certidão de falência complementar (TJSP/eproc)',cat:'Econômica',val:null,st:'pend'},
  {n:'Balanço patrimonial 2025 (SPED/ECD)',cat:'Econômica',val:null,st:'pend'},
  {n:'Balanço patrimonial 2024 (SPED/ECD)',cat:'Econômica',val:null,st:'pend'},
  {n:'Atestado técnico: Associação Alumni (plataforma educacional e gestão acadêmica)',cat:'Técnica',val:null,st:'ok',tags:['Educação e plataformas de ensino']},
  {n:'SICAF: CRC',cat:'Cadastro',val:'2027-08-04',st:'ok'},
  {n:'Cadastro BBMNET',cat:'Cadastro',val:null,st:'ok'},
];
const stDoc = d => { if(d.st==='pend') return ['st-err','Pendente']; if(d.st==='venc'||(d.val&&dias(d.val)<0)) return ['st-err','Vencida'];
  if(d.val&&dias(d.val)<=10) return ['st-warn','Vence em '+dias(d.val)+'d']; return ['st-ok','OK']; };

let S = { view: store('view')||'inicio', cat: 'Educação e plataformas de ensino', sub:null, uf:'', st:'', pr:'', q:'', faixa:'', drawer:null, dtab:'resumo', prop: store('prop')||null };
const ICONS = {
  inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/>',
  funil:'<path d="M3 4h18l-7 9v6l-4 2v-8z"/>',
  proposta:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/>',
  cofre:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M12 17v-1.5"/>',
  intel:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  portais:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>'
};
const ic = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

function nav(){
  const pend = COFRE.filter(d=>stDoc(d)[0]!=='st-ok').length;
  const items=[['inicio','Início'],['radar','Radar por categoria',P.filter(p=>p.g==='Software').length],['funil','Funil de disputa',Object.keys(FUNIL).length],['proposta','Proposta'],['cofre','Cofre e habilitação',pend],['intel','Inteligência'],['portais','Portais e robôs'],['config','Empresa e equipe']];
  $('#nav').innerHTML = items.map(([k,l,c])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${ic(k)}${l}${c!=null?`<span class="ct">${c}</span>`:''}</button>`).join('');
}
function go(v){ S.view=v; store('view',v); render(); window.scrollTo(0,0); }
function trocaEmpresa(v){ if(v==='nova'){ toast('Cadastro de empresa: CNPJ → a Receita preenche CNAEs, porte e sócios automaticamente'); $('#empSel').value='better'; } }

function render(){ nav(); const f={inicio,radar,funil,proposta,cofre,intel,portais,config}[S.view]||inicio; $('#main').innerHTML=f(); if(S.view==='funil') ligaDnD(); }

/* ---------------- INÍCIO ---------------- */
function inicio(){
  const sw=P.filter(p=>p.g==='Software');
  const prontos=P.filter(p=>p.st.startsWith('Pode'));
  const semana=P.filter(p=>p.dt && dias(p.dt)>=0 && dias(p.dt)<=7 && FUNIL[p.id]);
  const prox=P.filter(p=>p.dt && dias(p.dt)>=0 && p.p==='A' && p.st!=='Impedida').slice(0,8);
  const pend=COFRE.filter(d=>stDoc(d)[0]!=='st-ok');
  const porEt=ETAPAS.map(e=>({...e,n:Object.values(FUNIL).filter(x=>x===e.k).length}));
  return `
  <div class="top"><div><h1>Bom dia, Better Tech</h1><div class="sub">Pregões de software com sessão entre 28/09 e 31/10/2026 · motor Licita 360 atualizado hoje às 10:10</div></div><div class="sp"></div>
  <button class="btn" onclick="go('cofre')">Ver pendências</button><button class="btn pri" onclick="go('radar')">Abrir radar</button></div>
  <div class="grid k4">
    <div class="card pad kpi"><div class="l">Pregões de software no período</div><div class="n">${sw.length}</div><div class="d">${brl(sw.reduce((a,p)=>a+(p.v||0),0))} estimados</div></div>
    <div class="card pad kpi"><div class="l">Podem participar hoje</div><div class="n" style="color:var(--ok)">${prontos.length}</div><div class="d">sem vedação nem dependência do balanço (inclui com ressalvas)</div></div>

function catsResumo(){
  const m={}; P.forEach(p=>{ const c=p.c; m[c]=m[c]||{n:0,v:0,ok:0}; m[c].n++; m[c].v+=p.v||0; if(p.st.startsWith('Pode')) m[c].ok++; });
  return CAT_ORD.filter(c=>m[c]).map(c=>({c,...m[c]}));
}
function filtrados(){
  return P.filter(p=> p.c===S.cat && (!S.sub||p.s===S.sub) && (!S.uf||p.uf===S.uf) && (!S.st||p.st===S.st) && (!S.pr||p.p===S.pr)
    && (!S.q || (p.m+' '+p.o+' '+p.r+' '+p.obj).toLowerCase().includes(S.q.toLowerCase()))
    && (!S.faixa || faixaOk(p.v,S.faixa)));
}
function faixaOk(v,f){ if(f==='sig') return v==null; if(v==null) return false; const [a,b]=f.split('-').map(Number); return v>=a && v<b; }
function radar(){

  <div class="top"><div><h1>Radar por categoria</h1><div class="sub">Escolha a categoria: um clique traz todos os editais do período, já avaliados para a Better</div></div></div>

  <div class="subchips"><button class="sc ${!S.sub?'on':''}" onclick="S.sub=null;render()">Todas as subcategorias</button>${subs.map(s=>`<button class="sc ${S.sub===s?'on':''}" onclick='S.sub=${JSON.stringify(s)};render()'>${esc(s)}</button>`).join('')}</div>

    <input placeholder="Buscar órgão, município ou objeto" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window._q);window._q=setTimeout(render,250)">

    <select onchange="S.faixa=this.value;render()"><option value="">Qualquer valor</option>${[['0-80000','até R$ 80 mil'],['80000-500000','R$ 80–500 mil'],['500000-5000000','R$ 500 mil–5 mi'],['5000000-1e15','acima de R$ 5 mi'],['sig','sigiloso']].map(([k,l])=>`<option value="${k}" ${S.faixa===k?'selected':''}>${l}</option>`).join('')}</select>
    <div class="sp" style="flex:1"></div>

/* ---------------- PROPOSTA ---------------- */
function novaProposta(id){
  const p=P[id];
  const itens=(p.it.length?p.it:[[p.r.slice(0,90),12,'mês',p.v?p.v/12:10000,4]]).map(it=>({d:it[0],q:it[1]||1,u:it[2]||'un',ref:it[3]||0,custo:Math.round((it[3]||0)*0.55*100)/100}));
  S.prop={id,itens,ind:12,margem:15,iss:2,pis:1.65,cofins:7.6,irpj:0,texto:'',v:1};
  store('prop',S.prop); if(!FUNIL[id]){FUNIL[id]='proposta';salvaFunil();} fechaDrawer(); go('proposta');
}
function calcProp(pr){
  const custo=pr.itens.reduce((a,i)=>a+i.q*i.custo,0);
  const ind=custo*pr.ind/100; const base=custo+ind; const trib=(pr.iss+pr.pis+pr.cofins)/100; const mg=pr.margem/100;
  const preco=base/(1-trib-mg); const tributos=preco*trib; const lucro=preco*mg;
  const ref=pr.itens.reduce((a,i)=>a+i.q*i.ref,0); const piso=base/(1-trib);
  return {custo,ind,base,preco,tributos,lucro,ref,piso};
}
function proposta(){
  const pr=S.prop;
  if(!pr){ const sug=P.filter(p=>p.p==='A'&&p.st.startsWith('Pode')&&p.it.length).slice(0,6);
    return `<div class="top"><div><h1>Proposta</h1><div class="sub">Escolha um pregão para elaborar a proposta aqui dentro</div></div></div>
    <div class="card pad"><h2>Sugestões (prioridade A, prontos para disputar)</h2><table>${sug.map(p=>`<tr class="cl" onclick="novaProposta(${p.id})"><td><b>${esc(p.m)}/${p.uf}</b><div class="small muted">${esc(p.r.slice(0,120))}</div></td><td>${dt(p.dt)}</td><td class="num">${brl(p.v)}</td><td><button class="btn sm dk">Elaborar</button></td></tr>`).join('')}</table></div>`; }
  const p=P[pr.id]; const c=calcProp(pr);
  const inex = c.ref && c.preco < c.ref*0.5; const acima = c.ref && c.preco > c.ref;
  const passos=['Itens do edital','Custos','Preço e tributos','Texto técnico','Documentos','Revisão e assinatura'];
  return `<div class="top"><div><h1>Proposta · ${esc(p.m)}/${p.uf}</h1><div class="sub">${esc(p.o)} · sessão ${dt(p.dt)} · versão ${pr.v}</div></div><div class="sp"></div>
    <button class="btn" onclick="abre(${p.id})">Ver edital</button><button class="btn" onclick="S.prop.v++;store('prop',S.prop);toast('Versão '+S.prop.v+' salva');render()">Salvar versão</button><button class="btn pri" onclick="toast('PDF gerado e assinado com o certificado A1 da Better')">Gerar PDF assinado</button></div>
  <div class="steps">${passos.map((s,i)=>`<span class="step ${i<3?'done':i===3?'cur':''}">${i+1}. ${s}</span>`).join('')}</div>
  <div class="grid" style="grid-template-columns:1.6fr 1fr">
    <div class="grid" style="align-content:start">
      <div class="card pad"><h2>Itens e custo unitário</h2>
        <table><tr><th>Descrição</th><th class="num">Qtd</th><th class="num">Ref. edital</th><th class="num">Custo unit.</th><th class="num">Preço unit.</th><th class="num">Total</th></tr>
        ${pr.itens.map((it,i)=>{ const fator=c.custo? c.preco/c.custo : 1; const pu=it.custo*fator; return `<tr><td class="small">${esc(it.d)}</td><td class="num">${it.q.toLocaleString('pt-BR')} ${esc(it.u)}</td><td class="num muted">${brlF(it.ref)}</td>
          <td style="width:120px"><input class="in n" value="${it.custo}" onchange="S.prop.itens[${i}].custo=parseFloat(this.value.replace(',','.'))||0;store('prop',S.prop);render()"></td><td class="num">${brlF(pu)}</td><td class="num"><b>${brlF(pu*it.q)}</b></td></tr>`}).join('')}
        </table><div class="small muted" style="margin-top:8px">Os preços unitários herdam o rateio de indiretos, tributos e margem. A soma fecha exatamente com o global, como pedem os editais.</div></div>
      <div class="card pad"><h2>Texto técnico da proposta</h2>
        <textarea class="in" oninput="S.prop.texto=this.value;store('prop',S.prop)">${esc(pr.texto || textoBase(p))}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="S.prop.texto=textoBase(P[S.prop.id]);store('prop',S.prop);render();toast('Texto regenerado a partir do TR e do portfólio da Better')">Gerar com IA a partir do TR</button><button class="btn" onclick="toast('Checagem: todos os requisitos do TR foram citados')">Conferir aderência ao TR</button></div></div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card pad"><h2>Formação de preço (Lucro Real)</h2>
        ${[['ind','Despesas indiretas (%)'],['margem','Margem (%)'],['iss','ISS (%)'],['pis','PIS (%)'],['cofins','COFINS (%)']].map(([k,l])=>`<div class="tot"><span>${l}</span><input class="in n" style="width:80px" value="${pr[k]}" onchange="S.prop.${k}=parseFloat(this.value.replace(',','.'))||0;store('prop',S.prop);render()"></div>`).join('')}
        <div class="tot"><span>Custos diretos</span><b>${brlF(c.custo)}</b></div>
        <div class="tot"><span>Indiretos</span><span>${brlF(c.ind)}</span></div>
        <div class="tot"><span>Tributos sobre a receita</span><span>${brlF(c.tributos)}</span></div>
        <div class="tot"><span>Margem</span><span>${brlF(c.lucro)}</span></div>
        <div class="tot big"><span>Preço global</span><span>${brlF(c.preco)}</span></div>
        <div class="tot"><span>Estimado pelo órgão</span><span class="muted">${c.ref?brlF(c.ref):'sigiloso'}</span></div>
        <div class="tot"><span>Preço piso (margem zero)</span><b style="color:var(--lar)">${brlF(c.piso)}</b></div>
        ${inex?'<div class="alert st-err" style="margin-top:10px">Abaixo de 50% do estimado: indício de inexequibilidade (art. 59, §4º). Prepare a memória de cálculo.</div>':''}
        ${acima?'<div class="alert st-warn" style="margin-top:10px">Acima do estimado: a proposta será desclassificada se não baixar na fase de lances.</div>':''}
        ${!inex&&!acima&&c.ref?`<div class="alert st-ok" style="margin-top:10px">${(c.preco/c.ref*100).toFixed(0)}% do estimado · há espaço de ${brlF(c.preco-c.piso)} para lances até o piso.</div>`:''}
      </div>
      <div class="card pad"><h2>Documentos da proposta</h2>
        ${[['Proposta comercial assinada',1],['Planilha de composição de custos',1],['Declarações (menor, idoneidade, reserva de cargos, independente)',1],['Atestado de capacidade técnica',p.c.startsWith('Educação')?1:0],['Balanço patrimonial 2025',0],['Certidões fiscais atualizadas',0]].map(([n,o])=>`<div class="req"><span class="ico ${o?'st-ok':'st-err'}">${o?'✓':'×'}</span><div class="small">${n}</div></div>`).join('')}
      </div>
    </div>
  </div>`;
}
function textoBase(p){
  return `PROPOSTA TÉCNICA: ${p.o}\n\nObjeto: ${p.r}\n\nA BETTER TECH LTDA propõe o fornecimento da solução em modelo SaaS, hospedada em nuvem com alta disponibilidade, com implantação, migração de dados, treinamento dos usuários e suporte técnico durante toda a vigência.\n\n1. Solução ofertada: plataforma própria, desenvolvida e mantida pela Better Tech, com atualizações contínuas sem custo adicional.\n2. Implantação: cronograma em ondas (diagnóstico, parametrização, migração, treinamento, operação assistida).\n3. Suporte: help desk remoto em horário comercial, SLA de atendimento conforme o Termo de Referência.\n4. Segurança e LGPD: criptografia em trânsito e em repouso, backups diários e trilha de auditoria.\n5. Prazo: ${p.pz||'conforme o edital'}.\n\nValidade da proposta: 60 dias.`;
}

/* ---------------- COFRE ---------------- */
function cofre(){
  const ok=COFRE.filter(d=>stDoc(d)[0]==='st-ok').length; const score=Math.round(ok/COFRE.length*100);
  const cnae=[['8593-7/00','Ensino de idiomas (principal)'],['6201-5/01','Desenvolvimento de software sob encomenda'],['6202-3/00','Software customizável'],['6203-1/00','Software não customizável'],['6204-0/00','Consultoria em TI'],['6209-1/00','Suporte técnico em TI'],['6311-9/00','Hospedagem e tratamento de dados'],['6319-4/00','Portais e provedores de conteúdo'],['8599-6/04','Treinamento profissional'],['8599-6/99','Outras atividades de ensino']];
  return `<div class="top"><div><h1>Cofre e habilitação</h1><div class="sub">Documentos com validade, emissão automática de certidões e checagem contra cada edital</div></div><div class="sp"></div><button class="btn" onclick="toast('Renovando certidões automáticas…')">Renovar certidões</button><button class="btn pri" onclick="toast('Arraste o arquivo; a IA identifica o tipo e a validade')">Enviar documento</button></div>
  <div class="grid k4">
    <div class="card pad kpi"><div class="l">Saúde da habilitação</div><div class="n" style="color:${score>80?'var(--ok)':'var(--lar)'}">${score}%</div><div class="bar" style="height:8px"><i style="width:${score}%"></i></div></div>
    <div class="card pad kpi"><div class="l">Vencidas ou pendentes</div><div class="n" style="color:var(--err)">${COFRE.length-ok}</div><div class="d">bloqueiam o pacote de habilitação</div></div>
    <div class="card pad kpi"><div class="l">Porte / regime</div><div class="n" style="font-size:18px;margin-top:8px">Demais · Lucro Real</div><div class="d">fora de lotes exclusivos ME/EPP</div></div>
    <div class="card pad kpi"><div class="l">Cadastros</div><div class="n" style="font-size:18px;margin-top:8px">SICAF ✓ · BBMNET ✓</div><div class="d">BEC-SP e BLL pendentes</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:14px">
    <div class="card"><table><tr><th>Documento</th><th>Bloco</th><th>Validade</th><th>Situação</th><th></th></tr>
      ${COFRE.map(d=>{const [c,l]=stDoc(d); const pct=d.val?Math.max(0,Math.min(100,dias(d.val)/180*100)):0; return `<tr><td>${esc(d.n)}${d.tags?`<div class="small muted">serve para: ${d.tags.join(', ')}</div>`:''}</td><td class="small">${d.cat}</td>
      <td>${d.val?`${new Date(d.val).toLocaleDateString('pt-BR')}<div class="vbar"><i style="width:${pct}%;background:${c==='st-ok'?'var(--verde-esc)':c==='st-warn'?'#D9A400':'var(--err)'}"></i></div>`:'<span class="muted">—</span>'}</td>
      <td><span class="pill ${c}">${l}</span></td><td>${d.auto?'<button class="btn sm" onclick="toast(\'Emitindo…\')">Emitir</button>':'<button class="btn sm" onclick="toast(\'Upload\')">Enviar</button>'}</td></tr>`}).join('')}
    </table></div>
    <div class="grid" style="align-content:start">
      <div class="card pad"><h2>Qualificação econômica</h2>
        <div class="small muted" style="margin-bottom:10px">Envie o balanço de 2025 e o sistema calcula os índices, mostrando em quais editais a Better passa.</div>
        ${['Ativo circulante','Realizável a longo prazo','Ativo total','Passivo circulante','Passivo não circulante'].map((l,i)=>`<div class="tot"><span class="small">${l}</span><input class="in n" style="width:130px" id="bal${i}" placeholder="R$" oninput="calcIdx()"></div>`).join('')}
        <div id="idx" class="small" style="margin-top:10px"><span class="muted">Aguardando o balanço 2025.</span></div>
      </div>
      <div class="card pad"><h2>Contrato social × objeto</h2>
        <div class="small muted" style="margin-bottom:8px">CNAEs e cláusula 3ª: cada edital é checado contra eles</div>
        ${cnae.map(([c,d])=>`<div class="small" style="padding:3px 0"><b>${c}</b> ${d}</div>`).join('')}
        <div class="alert st-warn" style="margin-top:10px">Não cobre: revenda de hardware, digitalização física, impressão, monitoramento, frota e cartões.</div>
      </div>
      <div class="card pad"><h2>Biblioteca de atestados</h2>
        <div class="req"><span class="ico st-ok">✓</span><div class="small"><b>Associação Alumni</b><br>Plataforma educacional e gestão acadêmica · 3.000 alunos</div></div>
        <div class="req"><span class="ico st-n">+</span><div class="small muted">Adicionar atestados B2B (clientes corporativos) para ampliar o que dá para comprovar</div></div>
      </div>
    </div>
  </div>`;
}
function calcIdx(){
  const v=[0,1,2,3,4].map(i=>parseFloat(($('#bal'+i).value||'').replace(/\./g,'').replace(',','.'))||0);
  const [ac,rlp,at,pc,pnc]=v; if(!ac||!pc){ $('#idx').innerHTML='<span class="muted">Preencha ao menos o ativo e o passivo circulantes.</span>'; return; }
  const lc=ac/pc, lg=(ac+rlp)/(pc+pnc||1), sg=at/(pc+pnc||1), pl=at-pc-pnc;
  const f=(n,x)=>`<span class="pill ${x>1?'st-ok':'st-err'}">${n} ${x.toFixed(2)}</span>`;
  const passa = lc>1&&lg>1&&sg>1; const teto = pl>0? pl*10 : 0;
  $('#idx').innerHTML=`${f('LC',lc)} ${f('LG',lg)} ${f('SG',sg)}<div style="margin-top:8px">PL: <b>${brlF(pl)}</b></div><div class="alert ${passa?'st-ok':pl>0?'st-warn':'st-err'}" style="margin-top:8px">${passa?'Passa na regra padrão dos índices.':pl>0?`Índices abaixo de 1. Pela regra do PL mínimo de 10%, dá para disputar pregões de até <b>${brlF(teto)}</b>.`:'PL negativo: bloqueia os editais que exigem índices ou PL mínimo.'}</div>`;
}

/* ---------------- INTELIGÊNCIA ---------------- */
function intel(){
  const cat=S.cat; const L=P.filter(p=>p.c===cat);
  const agg=(k)=>{const m={}; L.forEach(p=>{m[p[k]]=m[p[k]]||{n:0,v:0}; m[p[k]].n++; m[p[k]].v+=p.v||0}); return Object.entries(m).sort((a,b)=>b[1].v-a[1].v);};
  const uf=agg('uf').slice(0,10), sub=agg('s'), tipo=agg('t'); const mx=a=>Math.max(...a.map(x=>x[1].v),1);
  const bars=(a)=>a.map(([k,o])=>`<div class="hbar"><span class="lb" title="${esc(k)}">${esc(k)}</span><span class="tr"><i style="width:${o.v/mx(a)*100}%"></i></span><span class="vl">${o.n} · ${brl(o.v)}</span></div>`).join('');
  const orgs=agg('o').slice(0,8);
  return `<div class="top"><div><h1>Inteligência de mercado</h1><div class="sub">Motor Licita 360: preços homologados, concorrentes e demanda por categoria</div></div><div class="sp"></div>
    <select class="btn" onchange="S.cat=this.value;render()">${catsResumo().map(k=>`<option ${k.c===cat?'selected':''}>${k.c}</option>`).join('')}</select></div>
  <div class="grid k3"><div class="card pad"><h2>Por estado</h2>${bars(uf)}</div><div class="card pad"><h2>Por subcategoria</h2>${bars(sub)}</div><div class="card pad"><h2>Por tipo de contratação</h2>${bars(tipo)}</div></div>
  <div class="grid k2" style="margin-top:14px">
    <div class="card pad"><h2>Maiores compradores no período</h2>${bars(orgs)}</div>
    <div class="card pad"><h2>O que o motor traz em cada edital</h2>
      <div class="req"><span class="ico st-v">1</span><div class="small"><b>Banco de preços</b>: mediana, p25 e p75 de itens equivalentes homologados no PNCP em todo o país</div></div>
      <div class="req"><span class="ico st-v">2</span><div class="small"><b>Concorrentes</b>: quem mais fatura com o órgão, taxa de contratação sem disputa e desconto médio nos lances</div></div>
      <div class="req"><span class="ico st-v">3</span><div class="small"><b>Risco do órgão</b>: CAPAG, sobrepreço histórico e sinais de direcionamento</div></div>
      <div class="req"><span class="ico st-v">4</span><div class="small"><b>Demanda futura</b>: PCA (plano de contratações anual) e contratos que vencem nos próximos 6 meses</div></div>
    </div>
  </div>`;
}

/* ---------------- PORTAIS ---------------- */
function portais(){
  const L=[['BBMNET','Conectado','st-ok','Robô de cadastro concluído; lances pelo painel'],['Compras.gov.br (SICAF)','Conectado','st-ok','CRC válido; acesso gov.br da administradora'],['Portal de Compras Públicas','Pendente','st-warn','O robô cadastra com os dados do cofre'],['BLL Compras','Pendente','st-warn','Cadastro assistido (captcha)'],['BEC-SP / CAUFESP','Pendente','st-warn','Precisa de certificado A1'],['Licitanet','Não iniciado','st-n',''],['BNC','Não iniciado','st-n','']];
  const usa={}; P.forEach(p=>{ const h=(p.pt||'').match(/https?:\/\/([^/]+)/); if(h){ const k=h[1].replace('www.',''); usa[k]=(usa[k]||0)+1; } });
  const top=Object.entries(usa).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<div class="top"><div><h1>Portais e robôs</h1><div class="sub">Credenciamento automático nos portais de disputa, com os dados e documentos do cofre</div></div></div>
  <div class="grid k2"><div class="card"><table><tr><th>Portal</th><th>Situação</th><th>Observação</th><th></th></tr>${L.map(([n,s,c,o])=>`<tr><td><b>${n}</b></td><td><span class="pill ${c}">${s}</span></td><td class="small muted">${o}</td><td>${c!=='st-ok'?'<button class="btn sm pri" onclick="toast(\'Robô de credenciamento iniciado\')">Credenciar</button>':''}</td></tr>`).join('')}</table></div>
  <div class="card pad"><h2>Onde estão os pregões do período</h2>${top.map(([k,n])=>`<div class="hbar"><span class="lb">${esc(k)}</span><span class="tr"><i style="width:${n/top[0][1]*100}%"></i></span><span class="vl">${n}</span></div>`).join('')}<div class="small muted" style="margin-top:8px">Credenciar-se nos três primeiros cobre a maior parte das disputas.</div></div></div>`;
}

/* ---------------- CONFIG ---------------- */
function config(){
  return `<div class="top"><div><h1>Empresa e equipe</h1><div class="sub">Multiempresa: a mesma conta gerencia várias empresas, cada uma com cofre, funil e marca próprios</div></div></div>
  <div class="grid k2">
    <div class="card pad"><h2>Better Tech Ltda</h2>
      ${[['CNPJ','53.286.868/0001-66'],['Sede','Barueri/SP'],['Porte','Demais'],['Regime','Lucro Real'],['Administradora','Juliana Galdino Melo de Lima'],['Inscrição municipal','5.BE699-6'],['Certificado A1','não cadastrado']].map(([k,v])=>`<div class="tot"><span class="muted">${k}</span><span>${v}</span></div>`).join('')}
      <h3 style="margin-top:14px">Perfil de busca</h3><div class="small">Plataformas educacionais, ensino de idiomas, EAD, desenvolvimento de software sob encomenda, SaaS de gestão. Abrangência nacional.</div></div>
    <div class="card pad"><h2>Equipe</h2>
      ${[['Juliana Galdino','Administradora · assina propostas'],['Raphael Ruiz','Dono da conta'],['Comercial Better','Operador do funil']].map(([n,r])=>`<div class="req"><span class="ico st-v">${n[0]}</span><div><b>${n}</b><div class="small muted">${r}</div></div></div>`).join('')}
      <button class="btn" style="margin-top:10px" onclick="toast('Convite enviado')">Convidar pessoa</button>
      <h3 style="margin-top:16px">Alertas</h3><div class="small">Digest diário às 07:15 por e-mail e WhatsApp, com os editais novos das categorias escolhidas e as certidões a vencer.</div></div>
  </div>`;
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechaDrawer(); });
(function(){ const h=new URLSearchParams(location.hash.slice(1)); if(h.get('v')) S.view=h.get('v'); if(h.get('cat')) S.cat=h.get('cat');
  if(h.get('prop')) { render(); novaProposta(+h.get('prop')); return; }
  render(); if(h.get('p')){ abre(+h.get('p')); if(h.get('tab')){S.dtab=h.get('tab');desenhaDrawer();} } })();
</script>
</body>
